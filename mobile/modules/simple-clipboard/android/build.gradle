plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.simpleclipboard'
version = '0.1.0'

android {
  namespace "expo.modules.simpleclipboard"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // Saving Simple Drop files into the folder the user picked
  implementation "androidx.documentfile:documentfile:1.1.0"
  // WebSocket client (React Native already ships OkHttp, Gradle reuses it)
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
